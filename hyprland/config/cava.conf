# Tokyo Night spectrum; opened explicitly, never started with the session.
[general]
framerate = 30
autosens = 1
sensitivity = 100
bars = 0
bar_width = 2
bar_spacing = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 12000
sleep_timer = 5

[input]
# PipeWire's PulseAudio compatibility exposes the default output's monitor.
# Capture playback only; this does not change volume or enable the microphone.
method = pulse
source = auto

[output]
method = ncurses
channels = stereo

[color]
background = '#090b10'
foreground = '#82aaff'
gradient = 1
gradient_count = 6
gradient_color_1 = '#89ddff'
gradient_color_2 = '#89ddff'
gradient_color_3 = '#82aaff'
gradient_color_4 = '#c792ea'
gradient_color_5 = '#c792ea'
gradient_color_6 = '#f07178'

[smoothing]
integral = 70
monstercat = 1
waves = 0
gravity = 100
ignore = 0
