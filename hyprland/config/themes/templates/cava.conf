# Tokyo Night spectrum; opened explicitly, never started with the session.
[general]
framerate = 30
autosens = 1
sensitivity = 100
bars = 0
bar_width = 2
bar_spacing = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 12000
sleep_timer = 5

[input]
# PipeWire's PulseAudio compatibility exposes the default output's monitor.
# Capture playback only; this does not change volume or enable the microphone.
method = pulse
source = auto

[output]
method = ncurses
channels = stereo

[color]
background = '#161925'
foreground = '#7aa2f7'
gradient = 1
gradient_count = 6
gradient_color_1 = '#73daca'
gradient_color_2 = '#7dcfff'
gradient_color_3 = '#7aa2f7'
gradient_color_4 = '#9d7cd8'
gradient_color_5 = '#bb9af7'
gradient_color_6 = '#ff9e9e'

[smoothing]
integral = 70
monstercat = 1
waves = 0
gravity = 100
ignore = 0
