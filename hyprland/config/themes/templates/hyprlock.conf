general {
    hide_cursor = true
}

background {
    monitor = DP-1
    path = $HOME/.config/hypr/wallpapers/orbit-landscape.png
    blur_passes = 1
    blur_size = 3
}

background {
    monitor = DP-2
    path = $HOME/.config/hypr/wallpapers/orbit-portrait.png
    blur_passes = 1
    blur_size = 3
}

input-field {
    monitor =
    size = 360, 58
    outline_thickness = 2
    outer_color = rgba(7aa2f7ee) rgba(bb9af7ee) 35deg
    inner_color = rgba(16161eee)
    check_color = rgb(7dcfff)
    fail_color = rgb(f7768e)
    font_color = rgb(c0caf5)
    font_family = Noto Sans CJK SC
    rounding = 16
    fade_on_empty = false
    dots_spacing = 0.3
    placeholder_text = 输入密码解锁
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = Noto Sans
    color = rgb(c0caf5)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%m月%d日 · %A'
    font_size = 20
    font_family = Noto Sans CJK SC
    color = rgb(7dcfff)
    position = 0, 25
    halign = center
    valign = center
}
