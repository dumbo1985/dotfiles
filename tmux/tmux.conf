# Terminal and responsiveness
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000

# Keep the familiar Ctrl+B prefix
set -g prefix C-b

# Sensible window and pane defaults
setw -g mode-keys vi
set -g mouse on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# Split panes with v / | (side by side) and - (top/bottom); keep the current directory
bind v split-window -h -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
unbind '"'
unbind %

# Vim-style pane navigation and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload this file with Prefix + r
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'

# Vi-style copy mode; use y to copy the selection
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Clearer status line
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 80
set -g status-left '[#S] '
set -g status-right '%Y-%m-%d %H:%M'
set -g window-status-current-format '#[bold]#I:#W#[default]'
set -g window-status-format '#I:#W'

# Plugins managed by TPM. Keep Ctrl+B as the tmux prefix.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
# Keep continuum last; it updates status-right to schedule periodic saves.
set -g @plugin 'tmux-plugins/tmux-continuum'

# Catppuccin Mocha status line.
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'left'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_date_time_text '%Y-%m-%d %H:%M'
set -g @catppuccin_status_left_separator ''
set -g @catppuccin_status_right_separator ''
set -g status-left-length 50
set -g status-right-length 100
set -g status-left '#{E:@catppuccin_status_session}'
set -g status-right '#{E:@catppuccin_status_directory}#{E:@catppuccin_status_date_time}'

# Save tmux sessions periodically and restore them when tmux starts.
set -g @continuum-restore 'on'
set -s set-clipboard on

# Initialize TPM after plugin declarations.
run '~/.tmux/plugins/tpm/tpm'
